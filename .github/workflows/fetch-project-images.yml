name: Store portfolio project screenshots

on:
  push:
    paths:
      - ".github/workflows/fetch-project-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Download live project screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/projects
          while IFS='|' read -r filename target; do
            [ -z "$filename" ] && continue
            encoded=$(node -p "encodeURIComponent(process.argv[1])" "$target")
            echo "Capturing $target"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0 (compatible; PortfolioScreenshotBot/1.0)" \
              "https://s.wordpress.com/mshots/v1/${encoded}?w=1200" \
              --output "assets/projects/${filename}.jpg"
            test -s "assets/projects/${filename}.jpg"
            file "assets/projects/${filename}.jpg"
          done <<'PROJECTS'
          frame-by-frame|https://melvinvarghese.github.io/letterboxd-profile-analyzer/
          taleatlas|https://melvinvarghese.github.io/TaleAtlas/
          awesome-thought-experiments|https://melvinvarghese.github.io/awesome-thought-experiments/
          little-wonder|https://melvinvarghese.github.io/Little-Wonder/
          writing-prompts|https://melvinvarghese.github.io/writing-prompts/
          message-from-god|https://melvinvarghese.github.io/Message-from-God/
          word-hunt|https://melvinvarghese.github.io/word-hunt/
          dont-touch-red|https://melvinvarghese.github.io/Don-t-Touch-Red/
          qrify|https://melvinvarghese.github.io/QRify/
          palette-postcards|https://melvinvarghese.github.io/Palette-Postcards/
          torrent-to-magnet|https://melvinvarghese.github.io/Torrent-to-Magnet-Converter/
          PROJECTS

      - name: Commit screenshots to this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Store project screenshots in portfolio repository"
            git push
          fi
